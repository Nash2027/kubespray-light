all:
  hosts:
    master1: {ansible_host: 192.168.4.11, ip: 192.168.4.11, access_ip: 192.168.4.11}
    master2: {ansible_host: 192.168.4.12, ip: 192.168.4.12, access_ip: 192.168.4.12}
    master3: {ansible_host: 192.168.4.13, ip: 192.168.4.13, access_ip: 192.168.4.13}
    worker1: {ansible_host: 192.168.4.21, ip: 192.168.4.21, access_ip: 192.168.4.21}
    worker2: {ansible_host: 192.168.4.22, ip: 192.168.4.22, access_ip: 192.168.4.22}
    worker3: {ansible_host: 192.168.4.23, ip: 192.168.4.23, access_ip: 192.168.4.23}
  vars:
    ansible_user: etudis
  children:
    kube_control_plane:
      hosts: {master1: , master2: , master3: }
    etcd:
      hosts: {master1: , master2: , master3: }
    kube_node:
      hosts: {worker1: , worker2: , worker3: }
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
